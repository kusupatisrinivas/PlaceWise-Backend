# Default local MySQL connection. Demo/test profiles override this explicitly.
spring.application.name=placewise
spring.datasource.url=jdbc:mysql://localhost:3306/placewise?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Preserve existing tables and rows; create/update only the mapped schema.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Hibernate discovers the MySQL dialect from the live JDBC connection.
spring.jackson.deserialization.fail-on-unknown-properties=true

server.port=${PORT:8080}
server.error.include-message=never

# Local JWT configuration is outside source control; JWT_SECRET can override it.
spring.config.import=optional:file:./application-local.properties
app.jwt-secret=${JWT_SECRET}
app.jwt-minutes=60
app.timezone=Asia/Kolkata
app.cors-origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
app.admin-email=${ADMIN_EMAIL:admin@placewise.edu}
app.admin-password=${ADMIN_PASSWORD:}
app.seed-demo=false
